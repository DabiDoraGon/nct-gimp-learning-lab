    <title>NCT GIMP Learning Lab — Prototype 01</title>
    <script>
      // Apply saved theme before first paint (dark is the GIMP-like default)
      (function () {
        try {
          var t = localStorage.getItem('nct-gimp-lab-theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
